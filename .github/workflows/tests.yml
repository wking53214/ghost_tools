name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # pytest-xdist is not optional: pyproject sets `addopts = "-n auto"`,
          # so pytest exits with `unrecognized arguments: -n` without it. It also
          # cuts this job from ~16 minutes to a few, because the suite is 751
          # mutants each running a whole test file in a fresh interpreter.
          python -m pip install pytest pytest-xdist ruff==0.15.22
      - name: Install gitleaks
        # Pinned exact version, same as ruff above. Tests/test_secrets*.py
        # skip themselves if this binary is absent; installed here so CI
        # actually exercises the real thing instead of skipping forever.
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Test
        run: python -m pytest -q
      - name: Lint (hard gate)
        run: ruff check .

  self-scan:
    # The tool that argues silence is the defect scans itself on every push.
    # The baseline holds three MAJOR findings, each with its reason in the
    # case file beside it; everything MINOR is reported on every run and
    # gates nothing. A new MAJOR or CRITICAL fails this job (exit 1).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0   # the secrets scan reads history
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install gitleaks
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
      - name: ghost-buster on ghost_tools
        # --no-tests: the test job above runs the suite; --no-branches: a
        # PR checkout has no base to compare; --no-ledger: nothing is
        # committed back from CI, so a ledger here would only ever be one
        # run long. Each is a declined check and says so in the output.
        run: |
          python -m ghost_buster.cli . --no-tests --no-branches --single-repo --no-ledger \
            --casefile .ghost_casefile.json

  swizzle-gate:
    # SWIZZLE replays its archived regression cases and its seed catalogue
    # against the base of this change and against the change itself.
    # `swizzle diff` exits 1 when a case that passed now fails (regressed) or
    # a failing case fails worse (worsened). Escapes already present on the
    # base are SWIZZLE's findings, not this job's failures: only a change
    # that makes ghost_buster worse at something it used to get right turns
    # this red. Measured locally: ~130s for both buckets, and disabling the
    # writability check in operate.py is caught
    # (claim_rewritten_while_the_suite_runs, NONE -> HIGH).
    #
    # SWIZZLE is private, so this job reads it with LIBRARY_READ_TOKEN and
    # fails by name when the secret is unset, as the library's other repos do.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          path: ghost_tools
          fetch-depth: 0   # the baseline revision is checked out from history
      - name: Authorise reads of SWIZZLE
        env:
          LIBRARY_READ_TOKEN: ${{ secrets.LIBRARY_READ_TOKEN }}
        run: |
          if [ -z "$LIBRARY_READ_TOKEN" ]; then
            echo "::error::LIBRARY_READ_TOKEN secret is not set; SWIZZLE is private and cannot be fetched"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          repository: wking53214/SWIZZLE
          path: swizzle
          token: ${{ secrets.LIBRARY_READ_TOKEN }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
      - name: Install SWIZZLE
        # pytest is not optional. SWIZZLE runs ghost_buster with its own
        # interpreter, and --operate runs each case's suite with pytest.
        # Without it both sides fail the suite-dependent cases identically,
        # nothing can regress, and the gate passes whatever changed: measured,
        # the disabled writability check above went through as "unchanged".
        run: python -m pip install ./swizzle pytest
      - name: Regression gate
        # SWIZZLE resolves `corpus/` from its working directory.
        working-directory: swizzle
        env:
          GHOST_TOOLS: ${{ github.workspace }}/ghost_tools
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "::warning::no base revision for this event; nothing to compare against"
            exit 0
          fi
          python -m swizzle diff --ghost "$BASE" --ghost "$GHOST_TOOLS"
          python -m swizzle diff --ghost "$BASE" --ghost "$GHOST_TOOLS" --seeds
