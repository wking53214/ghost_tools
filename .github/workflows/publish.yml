name: publish

# A version tag publishes to PyPI through trusted publishing: no token is
# stored anywhere. PyPI must know this workflow first (project settings,
# "Trusted publishers": owner wking53214, repository ghost_tools, workflow
# publish.yml, environment pypi). Until it does, the publish step fails
# and nothing else happens.
#
# Both `v*` and `V*` start a publish. Tag filters are case-sensitive, and the
# repository already carries one uppercase tag (V1.9.1) beside the lowercase
# ones, so a filter for lowercase alone would let an uppercase release tag
# push silently publish nothing. The next step then insists the part after
# the prefix is exactly the version pyproject.toml declares.
on:
  push:
    tags: ["v*", "V*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: The tag names the version pyproject declares
        run: |
          declared=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tagged="${GITHUB_REF_NAME#[vV]}"
          test "$declared" = "$tagged" || { echo "tag ${GITHUB_REF_NAME} but pyproject says $declared"; exit 1; }
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
